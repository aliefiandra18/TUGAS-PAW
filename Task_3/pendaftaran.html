<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Pendaftaran Workshop Web</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Tugas 3 PAW</h1>
    <nav>
      <a href="pendaftaran.html">Pendaftaran</a>
      <a href="detail.html">Detail</a>
    </nav>
  </header>

  <div class="wadah">
    <h2>Formulir Pendaftaran</h2>

    <form method="get" action="detail.html">
      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" name="nama" required>

      <label for="nim">NIM</label>
      <input type="text" id="nim" name="nim" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label>Jenis Kelamin</label>
      <div class="pilihan">
        <input type="radio" id="laki" name="gender" value="laki-laki" required>
        <label for="laki">Laki-laki</label>
        <input type="radio" id="perempuan" name="gender" value="perempuan">
        <label for="perempuan">Perempuan</label>
      </div>

      <label for="prodi">Program Studi</label>
      <select id="prodi" name="prodi">
        <option value="informatika">Teknik Informatika</option>
        <option value="sistem-informasi">Sistem Informasi</option>
        <option value="elektro">Teknik Elektro</option>
      </select>

      <label>Materi yang Diminati</label>
      <div class="pilihan">
        <input type="checkbox" id="html" name="minat" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="minat" value="css">
        <label for="css">CSS</label>
      </div>

      <label for="alasan">Alasan Mengikuti</label>
      <textarea id="alasan" name="alasan"></textarea>

      <button type="submit">Daftar</button>
    </form>
  </div>

  <footer>
    Tugas Individu 3 - Pengembangan Aplikasi Web
  </footer>

</body>

</html>
